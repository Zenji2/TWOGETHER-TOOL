<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Instrument</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>
    

</head>
<body>
    <dialog id="intro-modal">
        <p>TWOGETHER is a two player instrument tool. One of you plays the sound with the keyboard, and the other shapes how it sounds by moving the mouse.</p>
        <button id="intro-modal-close">let's go!</button>
    </dialog>

    <header>
        <h1>TWOGETHER</h1>
    </header>

    <main>
        <button id="test-button" class="whiteKey" data-note="C4">Make Sound</button>
        <button id="key-test" class="whiteKey" data-note="D4">key</button>

        <audio id="audio-track" src="./assets/audio/p-hase_Leapt.mp3">controls</audio>
        <button id="playback-button">play</button>
        <button id="random-location">random</button>

    <!--     image for spatial control -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Augusta_Dohlmann_Wild_flowers_%281905%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
             alt="painting of flowers in a vase" id="flower-painting" data-note="a3">

    <!--     keyboard player -->
        <section id="keyboard-player" aria-label="Keyboard player">
            <h2>Keyboard Player</h2>
            <p>Press a key to play a note.</p>
            <div class="key-row">
                <button class="keyboard-key" data-note="C4">A</button>
                <button class="keyboard-key" data-note="D4">S</button>
                <button class="keyboard-key" data-note="E4">D</button>
                <button class="keyboard-key" data-note="F4">F</button>
                <button class="keyboard-key" data-note="G4">G</button>
                <button class="keyboard-key" data-note="A4">H</button>
                <button class="keyboard-key" data-note="B4">J</button>
                <button class="keyboard-key" data-note="C5">K</button>
                <button class="keyboard-key" data-note="D5">L</button>
            </div>
        </section>

    <!--     mouse player -->
        <section id="mouse-player" aria-label="Mouse player">
            <h2>Mouse player</h2>
            <p>Move your mouse over the canvas to shape the sound.</p>
            <canvas id="mouse-canvas"></canvas>
        </section>
    </main>
</body>
</html>
